{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-aside"><div class="eyebrow">WELCOME BACK</div><h1>Ready to beat<br><span class="gradient-text">your best score?</span></h1><p>Log in to play, review your history, and climb the leaderboard.</p></div>
  <form class="form-card" method="post">
    <h2>Log in</h2><p class="muted">Enter your account details.</p>
    <label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
    <button class="btn btn-primary full-width" type="submit">Log in →</button>
    <p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
