{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-aside"><div class="eyebrow">START YOUR CHALLENGE</div><h1>Make every<br><span class="gradient-text">second count.</span></h1><p>Create an account to save your scores and follow your progress.</p></div>
  <form class="form-card" method="post">
    <h2>Create account</h2><p class="muted">Join Colour Rush for free.</p>
    <label for="username">Username</label><input id="username" name="username" type="text" minlength="3" maxlength="24" required autocomplete="username" placeholder="Choose a username">
    <label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
    <button class="btn btn-primary full-width" type="submit">Create account →</button>
    <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</section>
{% endblock %}
